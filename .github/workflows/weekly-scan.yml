name: Weekly Intelligence Scan

on:
  schedule:
    - cron: '0 6 * * 1'   # Every Monday 06:00 UTC
  workflow_dispatch:        # Manual trigger for testing

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Write Gemini API key to config.js
        run: |
          echo "window.GEMINI_KEY = '${{ secrets.GEMINI_API_KEY }}';" > config.js

      - name: Run scan
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scan.py

      - name: Commit results
        run: |
          git config user.name  "CMIplus Bot"
          git config user.email "bot@cmiplus-cockpit"
          git add briefing.json flagship-analyses.json config.js
          git diff --cached --quiet || git commit -m "Weekly scan $(date -u '+%Y-%m-%d')"
          git push
