name: Weekly Intelligence Scan

on:
  schedule:
    # Every Monday at 06:00 UTC = 07:00 CET / 08:00 CEST
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run weekly scan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scan.py

      - name: Write config.js with API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "// Auto-generated by GitHub Actions — do not edit manually" > config.js
          echo "const GEMINI_KEY = '${GEMINI_API_KEY}';" >> config.js

      - name: Commit and push
        run: |
          git config user.name "CMIplus Cockpit Bot"
          git config user.email "cockpit-bot@cmiplus.local"
          git add briefing.json config.js
          git diff --staged --quiet || git commit -m "Weekly briefing + config: $(date -u +'%Y-%m-%d')"
          git push
